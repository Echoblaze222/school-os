name: Build Android APK

# Builds the SchoolOS Android wrapper (Capacitor) and uploads it as a
# downloadable artifact. Runs automatically on changes to the native
# project or Capacitor config, and can also be triggered manually from
# the Actions tab (Run workflow) any time.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'www/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          # actions/setup-java also exposes JAVA_HOME_<major>_<arch>, which
          # survives even if a later step (android-actions/setup-android)
          # resets the default JAVA_HOME. Pin explicitly rather than relying
          # on step order — this is what caused the "invalid source release:
          # 21" failures even after setup-java was set to 21.
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          echo "Using JDK:"
          java -version
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: schoolos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
